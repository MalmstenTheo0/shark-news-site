name: Publish Shark News

# Site code lives here; digests live in the separate shark-news-data repo, the
# only place the agent holds credentials for. A GitHub deploy key is scoped to
# one repository by design, so the agent simply cannot reach this repo — that
# is the security boundary, not a rule that could be bypassed.
#
# The build validates every digest before anything is deployed: a bad file
# fails the run and leaves the live site untouched.
#
# The data repo cannot trigger this workflow (cross-repo triggering would need
# a token in the agent's hands, reintroducing the very problem we removed), so
# publishing runs on a schedule shortly after the agent's daily 09:00 ART push,
# plus manually via workflow_dispatch whenever needed.

on:
  push:
    branches: [main]
  schedule:
    - cron: "20 12 * * 1-5" # 09:20 ART, weekdays — after the agent's 09:00 push
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site code
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Check out digests
        uses: actions/checkout@v4
        with:
          repository: MalmstenTheo0/shark-news-data
          path: _data

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install --quiet jsonschema

      - name: Validate digests and assemble site
        run: python scripts/build.py --data _data/data --out _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
