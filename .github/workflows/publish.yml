name: Publish Shark News

# Site code comes from `main`; digests come from `data` (the only branch the
# agent can push to). The build validates every digest before anything is
# deployed — a bad file fails the run and leaves the live site untouched.
#
# Deliberately NOT triggered by pushes to `data`: push-triggered workflows run
# the workflow file of the pushed branch, so a compromised agent could edit its
# own CI. Instead this file lives only on `main` (which the agent cannot touch)
# and publishes on a schedule shortly after the agent's daily 09:00 ART run,
# plus manually via workflow_dispatch whenever needed.

on:
  push:
    branches: [main]
  schedule:
    - cron: "20 12 * * 1-5" # 09:20 ART, weekdays — after the agent's 09:00 push
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site code
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Check out digests
        uses: actions/checkout@v4
        with:
          ref: data
          path: _data

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install --quiet jsonschema

      - name: Validate digests and assemble site
        run: python scripts/build.py --data _data/data --out _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
